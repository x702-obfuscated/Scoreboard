<!DOCTYPE html>
<html>

        <title>Controls</title>

        <link rel="stylesheet" href="./css/navmenu.css">

        <link rel="stylesheet" href="./css/clock.css">

    <body>
        <nav>
            <div class="navLeft">
                <h1>The Gospel Games</h1>
            </div>
            <div class="navCenter">
                
            </div>
            <div class="navRight">
                <a href="./pages/board.html" target="_blank"><button>Scoreboard</button></a>
            </div>

        <main>
            <section class="clock">
                <div class="clockBorder">
                    <h1 class="edit">00:00</h1>

                    <div class="clockControls">

                        <button class="pauseButton">Pause</button>

                    </div>
                </div>

            </section>
            <secton class="teams-container teams-control">

                <div class="team-panel" id="team1">Team 1</div>
                <div class="team-panel" id="team2">Team 2</div>
                <div class="team-panel" id="team3">Team 3</div>
                <div class="team-panel" id="team4">Team 4</div>


            </secton>

        </main>

        <script src="./js/clock.js"></script>
